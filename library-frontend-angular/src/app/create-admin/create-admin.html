<div class="container" style="max-width: 500px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-1">Create a new Admin</h4>
      <p class="text-muted small">Only admins can create other admin accounts.</p>
      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" name="username" [(ngModel)]="username" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" [(ngModel)]="password" required />
        </div>
        @if (error()) {
          <div class="alert alert-danger py-2">{{ error() }}</div>
        }
        @if (message()) {
          <div class="alert alert-success py-2">{{ message() }}</div>
        }
        <button type="submit" class="btn btn-primary">Create Admin</button>
      </form>
    </div>
  </div>
</div>
